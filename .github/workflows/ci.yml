name: Java CI with Gradle

on:
  push:
    branches:
      - "2.x"
      - "modernize/kotlin-agent-bridge"
    tags:
      - "v*"
      - "3.*"
  pull_request:
    branches:
      - "2.x"
      - "modernize/kotlin-agent-bridge"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon assemble test

      - name: Verify self-contained JitPack JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/dex2jar-3.0.jar"
          test -s "$JAR"
          echo "Artifact size: $(du -h "$JAR" | cut -f1)"
          JAR_BYTES="$(stat -c%s "$JAR")"
          echo "Artifact bytes: $JAR_BYTES"
          if [ "$JAR_BYTES" -gt 8000000 ]; then
            echo "Jar too large (>8MB). Largest package counts:"
            unzip -l "$JAR" | awk 'NF == 4 && $4 !~ /\/$/ {n=split($4,p,"/"); key=(n>1 ? p[1] "/" p[2] : p[1]); count[key]++} END {for (key in count) print count[key], key}' | sort -rn | head -20
            echo "Largest individual entries:"
            unzip -l "$JAR" | sort -nr | head -20
            exit 1
          fi
          unzip -t "$JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -F "Main-Class: riad.codes.dex2jar.tools.Dex2jarCmd"
          jar tf "$JAR" | grep -F "riad/codes/dex2jar/tools/Dex2jarCmd.class"
          jar tf "$JAR" | grep -F "org/objectweb/asm/ClassReader.class"
          jar tf "$JAR" | grep -F "kotlin/Unit.class"
          jar tf "$JAR" | grep -F "org/antlr/v4/runtime/Parser.class"
          jar tf "$JAR" | grep -F "org/antlr/runtime/Token.class"
          if jar tf "$JAR" | grep -Eq '^(com/ibm/icu/|org/antlr/v4/tool/|org/stringtemplate/v4/)'; then
            echo "JAR contains build-time ANTLR/ICU tooling that must not ship with the CLI"
            exit 1
          fi
          if jar tf "$JAR" | grep -E "\\.jar$"; then
            echo "Fat JAR unexpectedly contains nested JAR files"
            exit 1
          fi

      - name: Verify root JitPack publication task
        run: ./gradlew --no-daemon :publishMavenJavaPublicationToMavenLocal -x test

      - name: Build CLI distribution
        run: ./gradlew --no-daemon :dex-tools:distZip

      - name: Archive distributable artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dex2jar-${{ github.run_id }}
          path: |
            build/libs/dex2jar-3.0.jar
            dex-tools/build/distributions/dex-tools.zip
